name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - extra_model_paths.yaml
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      comfy_ref:
        description: "ComfyUI のブランチ／タグ／コミットハッシュ"
        required: false
        default: "master"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # torch(CUDA)入りイメージは大きく、標準ランナーの空き容量では不足しうるため先に掃除する
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMFY_REF=${{ inputs.comfy_ref || 'master' }}

      - name: Show image tag for RunPod
        run: |
          echo "RunPod のエンドポイントに設定するイメージ:"
          echo "${{ env.IMAGE }}:sha-${GITHUB_SHA::7}"
