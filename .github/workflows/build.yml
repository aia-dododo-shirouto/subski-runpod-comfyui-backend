name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - extra_model_paths.yaml
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      comfy_ref:
        description: "ComfyUI のブランチ／タグ／コミットハッシュ"
        required: false
        default: "master"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # RunPod エンドポイント subski-comfyui-backend のテンプレート ID
  RUNPOD_TEMPLATE_ID: n655zv5a8s

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # torch(CUDA)入りイメージは大きく、標準ランナーの空き容量では不足しうるため先に掃除する
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMFY_REF=${{ inputs.comfy_ref || 'master' }}

      # push したイメージの digest で RunPod のテンプレートを更新する（手でコピーすると取り違えるため）
      - name: Update RunPod template image
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          if [ -z "${RUNPOD_API_KEY}" ]; then
            echo "::error::Secret RUNPOD_API_KEY が未設定です"
            exit 1
          fi
          echo "テンプレート ${RUNPOD_TEMPLATE_ID} を ${IMAGE_REF} に更新します"
          RESPONSE=$(curl -fsS -X PATCH "https://rest.runpod.io/v1/templates/${RUNPOD_TEMPLATE_ID}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"imageName\":\"${IMAGE_REF}\"}")
          ACTUAL=$(echo "${RESPONSE}" | python3 -c "import json,sys;print(json.load(sys.stdin).get('imageName',''))")
          echo "更新後の imageName: ${ACTUAL}"
          if [ "${ACTUAL}" != "${IMAGE_REF}" ]; then
            echo "::error::テンプレートの imageName が期待値と一致しません"
            exit 1
          fi
